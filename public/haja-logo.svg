<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="200" height="200">
  <defs>
    <!-- 아름다운 네온 오로라 그라데이션 -->
    <linearGradient id="hajaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E2DE2" />   <!-- Deep Purple -->
      <stop offset="50%" stop-color="#F000FF" />  <!-- Neon Magenta -->
      <stop offset="100%" stop-color="#FF5E3A" /> <!-- Vibrant Orange -->
    </linearGradient>

    <!-- 은은한 글로우(빛 번짐) 및 그림자 효과 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur" />
      <feOffset dx="0" dy="4" result="offsetBlur" />
      <feFlood flood-color="#F000FF" flood-opacity="0.4" result="glowColor" />
      <feComposite in="glowColor" in2="offsetBlur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 다크 모드 스타일의 앱 아이콘 배경 -->
  <rect width="120" height="120" rx="28" fill="#13131A" />

  <!-- 중앙으로 밀집된 'ㅎ' 로고 그룹 -->
  <g filter="url(#glow)">
    <!-- 1. 위쪽 꼭지 (중앙으로 더 내려오고, 아주 살짝만 오른쪽으로 치우침) -->
    <circle cx="64" cy="36" r="9" fill="url(#hajaGradient)" />
    
    <!-- 2. 중간 가로선 (길이를 살짝 줄이고 간격을 좁힘, 기울기 조절) -->
    <rect x="26" y="51" width="68" height="12" rx="6" fill="url(#hajaGradient)" transform="rotate(-12, 60, 57)" />
    
    <!-- 3. 아래쪽 곡선 (위로 바짝 끌어올려 중간 선과 맞물리는 듯한 장력 형성) -->
    <path d="M 42 76 A 19 19 0 1 0 80 71" stroke="url(#hajaGradient)" stroke-width="12" fill="none" stroke-linecap="round" />
  </g>
</svg>
