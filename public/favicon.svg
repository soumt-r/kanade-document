<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="200" height="200">

  <defs>
    <linearGradient id="kanadeGradient" x1="24" y1="30" x2="94" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8E2DE2"></stop>
      <stop offset="0.52" stop-color="#F000FF"></stop>
      <stop offset="1" stop-color="#FF5E3A"></stop>
    </linearGradient>

    <linearGradient id="chickGradient" x1="43" y1="51" x2="79" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE866"></stop>
      <stop offset="1" stop-color="#FFC928"></stop>
    </linearGradient>

    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.2" result="blur"></feGaussianBlur>

      <feOffset dy="3" result="offset"></feOffset>

      <feFlood flood-color="#F000FF" flood-opacity=".32" result="color"></feFlood>

      <feComposite in="color" in2="offset" operator="in" result="glow"></feComposite>

      <feMerge>
        <feMergeNode in="glow"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>


  <!-- Background -->
  <rect width="120" height="120" rx="28" fill="#13131A"></rect>


  <g filter="url(#glow)">

    <!-- 하다의 상단 점 -->
    <circle cx="64" cy="35" r="8.5" fill="url(#kanadeGradient)"></circle>


    <!-- ㅎ 가로 획 -->
    <path d="
        M 29 51.5
        C 28.0 51.5 26.9 52.2 26.4 53.4
        C 25.8 54.8 26.5 56.2 28.0 56.7

        C 43.0 61.8 63.5 62.3 84.8 58.7

        C 88.5 58.1 92.0 56.7 94.5 54.7
        C 95.6 53.8 95.2 52.0 93.7 51.4

        C 92.7 51.0 91.5 51.0 90.4 51.2

        C 73.0 54.0 50.0 53.9 29 51.5
        Z
      " fill="url(#kanadeGradient)"></path>


    <!-- ㅎ 아래 곡선 -->
    <path d="
        M 39.0 70.0

        C 34.0 74.5 31.8 80.1 33.5 83.2
        C 35.0 86.0 39.1 86.3 42.2 83.8

        C 48.8 78.6 54.0 72.5 59.0 67.0

        C 62.2 63.4 67.0 61.8 72.0 62.7

        C 79.0 64.0 83.8 70.1 83.2 76.0

        C 82.8 80.1 80.1 83.4 76.3 84.7
        C 73.5 85.7 71.8 83.3 73.4 81.0

        C 75.1 78.6 76.8 75.7 76.0 72.9

        C 75.2 70.0 72.4 68.0 69.2 68.1

        C 65.2 68.2 62.0 72.2 59.0 76.0

        C 54.8 81.3 50.0 85.9 44.0 88.1

        C 37.0 90.6 29.7 88.2 27.7 82.5

        C 25.5 76.2 29.7 69.3 36.2 65.0

        Z
      " fill="url(#kanadeGradient)" fill-rule="evenodd"></path>


    <!--
      병아리 본체
      부리와 꼬리가 자연스럽게 이어지도록
      실루엣 자체에 접합 여유를 둠
    -->
    <path d="
        M 47.0 66.0

        C 47.7 57.8 54.2 51.8 62.0 50.5

        C 69.1 49.3 76.2 52.8 79.3 58.7

        C 81.8 63.4 81.5 69.3 79.2 74.2

        C 77.2 78.4 73.3 81.5 68.8 82.9

        C 64.4 84.3 59.0 84.1 54.4 82.6

        C 51.2 81.6 48.4 79.8 46.1 77.5

        C 44.5 75.9 43.7 74.0 44.5 72.5

        C 45.1 71.3 46.3 70.6 48.0 70.1

        L 40.0 67.5

        C 38.7 67.1 38.5 65.5 39.8 64.9

        L 47.2 61.9

        C 46.9 63.3 46.8 64.7 47.0 66.0

        Z
      " fill="url(#chickGradient)"></path>


    <!--
      연결된 꼬리.
      몸통 안쪽에서 시작하여
      '붙여놓은 삼각형' 느낌을 제거
    -->
    <path d="
        M 74.8 56.8
        C 78.5 54.2 82.6 52.7 86.2 52.2
        C 84.8 55.7 82.5 59.0 79.0 61.2
        C 77.1 62.0 75.5 60.1 74.8 56.8
        Z
      " fill="#FFD94A"></path>


    <!-- 날개 -->
    <path d="
        M 53.5 70.5
        C 57.1 68.1 62.4 69.0 65.1 72.3
        C 66.0 73.4 66.5 74.7 66.6 76.0
        C 62.7 77.8 57.3 77.1 54.0 74.1
      " fill="#F3B91F" opacity=".88"></path>


    <!-- 눈 -->
    <circle cx="68.8" cy="61.0" r="2.15" fill="#13131A"></circle>

  </g>

</svg>